# Project-owned R157 verified operator-local upgrade, preserving original range coverage.
# Originally generated by the CVF workspace bootstrap from the pinned downstream gate profile
# (cvf.downstreamGateProfile@1.1.0). Editing this file changes the pinned rendering
# and is reported as CI_WORKFLOW_DRIFT by the Core doctor. A YAML token is NOT executed CI evidence.
# The three pins below are checked against the actual bytes of scripts/cvf_gates before any project
# module is imported. They live in project-controlled YAML, so they are tamper evidence for inconsistent
# edits, not an independent trust root; the independent anchor is the Core doctor (--trusted).
name: cvf-downstream-gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cvf-downstream-gates:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CVF_DG_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run mandatory CVF downstream gates (pr-ci phase)
        run: >-
          python scripts/cvf_gates/cvf_downstream_gate_runner.py run --phase pr-ci
          --project-root .
          --base-from-env CVF_DG_BASE --head HEAD
          --expect-profile-sha256 3e14e4ad99a18416752b4666c4f0bed4cc7436068ef6e1c8768f34505e566c1f
          --expect-runner-sha256 f21777579758f152ddad55f153edd1921162ac16ed24788943638fc1602669c1
          --expect-bundle-sha256 d7e56f089a3ba9ca289953caeb7fa452cefde371b9ab82a793baf3552169654f
          --historical-admissions docs/reviews/probes/r157_verified_adoption_20261107/historical_manifest.json
          --historical-admissions-sha256 683ec6423294c5ce7ee06bc5c507c4592db25f5da1ca6e53b9b48f4aa375a31e
          --historical-admissions-commit 777b30582f71aef5e4d786efc58e135fe06d2d1f
