name: Release

# Cố ý KHÔNG chạy tự động theo push: release là quyết định của người vận hành,
# gom các thay đổi lại khi thấy ổn rồi mới bấm Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate date-based version
        id: version
        run: |
          TODAY=$(date -u +%Y.%m.%d)
          # Lấy hậu tố lớn nhất hiện có rồi cộng 1. Cố ý không đếm số tag:
          # thiếu tag gốc hoặc có tag bị xoá là số đếm ra trùng tag đã tồn tại,
          # và vì bước build chạy trước bước tạo tag nên image sẽ bị đẩy lên
          # đè phiên bản cũ trước khi lỗi lộ ra.
          MAX=0
          for tag in $(git tag -l "v${TODAY}" "v${TODAY}.*"); do
            suffix=${tag#v${TODAY}}
            suffix=${suffix#.}
            n=${suffix:-1}
            case "$n" in
              ''|*[!0-9]*) continue ;;
            esac
            [ "$n" -gt "$MAX" ] && MAX=$n
          done
          if [ "$MAX" -eq "0" ]; then
            VERSION="${TODAY}"
          else
            VERSION="${TODAY}.$((MAX + 1))"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "=== Version: v${VERSION} ==="

      # Chặn ngay tại đây, trước khi build, để không đẩy image đè lên một
      # phiên bản đã phát hành.
      - name: Ensure tag is free
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "::error::tag v${{ steps.version.outputs.version }} đã tồn tại, dừng trước khi build"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            buitanviet/chat-quality-agent:${{ steps.version.outputs.version }}
            buitanviet/chat-quality-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.nginx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            buitanviet/chat-quality-agent-nginx:${{ steps.version.outputs.version }}
            buitanviet/chat-quality-agent-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tag đặt sau khi cả hai image đã đẩy lên thành công, để build hỏng
      # không để lại tag không có image kèm theo.
      - name: Create git tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
